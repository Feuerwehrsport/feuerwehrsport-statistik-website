name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Bundle install
        run: bundle install --jobs 4
      - name: RuboCop
        run: bundle exec rubocop
      - name: Bundler Audit
        run: bin/bundler-audit check --update

  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: feuerwehrsport-statistik-test
          POSTGRES_USER: feuerwehrsport-statistik
          POSTGRES_PASSWORD: feuerwehrsport-statistik
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick libpq-dev
      - uses: jdx/mise-action@v2
      - name: Bundle install
        run: bundle install --jobs 4
      - name: Prepare database
        run: bin/rails db:schema:load
      - name: RSpec
        run: bundle exec rspec
